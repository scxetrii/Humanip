[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q

markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks end-to-end tests that call real LLM APIs
